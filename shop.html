<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop — ANON-X</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg: #050508;
            --surface: #0c0c12;
            --card: #12121a;
            --border: rgba(255,255,255,0.06);
            --text: #f0f0f5;
            --muted: #6b7280;
            --accent: #818cf8;
            --accent2: #c084fc;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow-x: hidden;
        }

        nav {
            position: fixed; top: 0; left: 0; right: 0;
            padding: 1.5rem 3rem;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 100;
            background: rgba(5,5,8,0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
        }
        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem; font-weight: 700;
            letter-spacing: 0.2em;
            color: var(--text);
            text-decoration: none;
        }
        .nav-links { display: flex; gap: 2.5rem; }
        .nav-links a {
            color: var(--muted); text-decoration: none;
            font-size: 0.85rem; font-weight: 500;
            letter-spacing: 0.05em;
            transition: color 0.3s;
            position: relative;
        }
        .nav-links a:hover, .nav-links a.active { color: var(--text); }
        .nav-links a::after {
            content: ''; position: absolute;
            bottom: -6px; left: 50%; width: 0; height: 1px;
            background: var(--accent);
            transition: all 0.3s; transform: translateX(-50%);
        }
        .nav-links a:hover::after, .nav-links a.active::after { width: 100%; }

        .cart-btn {
            position: relative; cursor: pointer;
            font-size: 1.3rem; transition: transform 0.3s;
        }
        .cart-btn:hover { transform: scale(1.1); }
        .cart-count {
            position: absolute; top: -8px; right: -10px;
            background: var(--accent); color: var(--bg);
            font-size: 0.65rem; font-weight: 700;
            width: 18px; height: 18px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
        }

        .page-header {
            padding: 10rem 3rem 4rem;
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
        }
        .page-header h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.5rem, 5vw, 4rem);
            font-weight: 600;
            margin-bottom: 1rem;
        }
        .page-header p {
            color: var(--muted);
            font-size: 1.1rem;
            line-height: 1.7;
        }

        .shop-section {
            padding: 0 3rem 8rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        .shop-filters {
            display: flex;
            justify-content: center;
            gap: 0.75rem;
            margin-bottom: 3rem;
            flex-wrap: wrap;
        }
        .filter-btn {
            padding: 0.6rem 1.8rem;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--muted);
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            border-radius: 100px;
            transition: all 0.4s;
        }
        .filter-btn:hover, .filter-btn.active {
            color: var(--text);
            border-color: var(--accent);
            background: rgba(129,140,248,0.1);
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .product-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            overflow: hidden;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            position: relative;
        }
        .product-card::before {
            content: ''; position: absolute;
            inset: 0; border-radius: 20px;
            padding: 1px;
            background: linear-gradient(135deg, rgba(129,140,248,0.3), transparent 50%, rgba(192,132,252,0.2));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor; mask-composite: exclude;
            opacity: 0; transition: opacity 0.5s;
            pointer-events: none;
        }
        .product-card:hover::before { opacity: 1; }
        .product-card:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: rgba(129,140,248,0.2);
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5), 0 0 60px -15px rgba(129,140,248,0.15);
        }

        .product-visual {
            height: 220px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .product-glow {
            position: absolute;
            width: 180px;
            height: 180px;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.4;
            transition: all 0.5s;
        }
        .product-card:hover .product-glow {
            opacity: 0.7;
            transform: scale(1.3);
        }
        .product-emoji {
            font-size: 4.5rem;
            position: relative;
            z-index: 2;
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            filter: drop-shadow(0 10px 30px rgba(0,0,0,0.3));
        }
        .product-card:hover .product-emoji {
            transform: scale(1.15) rotate(-5deg);
        }

        .product-info { padding: 1.5rem; }
        .product-cat {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--accent);
            margin-bottom: 0.5rem;
            font-weight: 600;
        }
        .product-name {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }
        .product-desc {
            font-size: 0.85rem;
            color: var(--muted);
            line-height: 1.6;
            margin-bottom: 1.25rem;
        }
        .product-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .product-price {
            font-size: 1.3rem;
            font-weight: 700;
            background: linear-gradient(135deg, #fff, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .add-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            transition: all 0.3s;
            position: relative;
        }
        .add-btn::after {
            content: '+';
            position: absolute;
        }
        .add-btn:hover {
            background: var(--accent);
            border-color: var(--accent);
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(129,140,248,0.4);
        }

        .cart-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            z-index: 200;
            opacity: 0; visibility: hidden;
            transition: all 0.4s;
        }
        .cart-overlay.open { opacity: 1; visibility: visible; }

        .cart-sidebar {
            position: fixed; top: 0; right: -450px;
            width: 450px; height: 100vh;
            background: var(--surface);
            border-left: 1px solid var(--border);
            z-index: 300;
            transition: right 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex; flex-direction: column;
        }
        .cart-sidebar.open { right: 0; }

        .cart-header {
            padding: 2rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .cart-header h3 {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
        }
        .cart-close {
            background: none; border: none;
            color: var(--muted); font-size: 1.8rem;
            cursor: pointer; transition: color 0.3s;
        }
        .cart-close:hover { color: var(--text); }

        .cart-items {
            flex: 1; overflow-y: auto; padding: 1.5rem;
        }
        .cart-empty {
            text-align: center; color: var(--muted);
            padding: 4rem 2rem; font-size: 0.9rem;
        }
        .cart-item {
            display: flex; gap: 1rem;
            padding: 1.2rem;
            background: rgba(255,255,255,0.02);
            border-radius: 16px;
            margin-bottom: 1rem;
            border: 1px solid var(--border);
            transition: all 0.3s;
        }
        .cart-item:hover {
            border-color: rgba(129,140,248,0.2);
            background: rgba(255,255,255,0.03);
        }
        .cart-item-emoji { font-size: 2.5rem; }
        .cart-item-info { flex: 1; }
        .cart-item-name { font-weight: 600; margin-bottom: 0.25rem; }
        .cart-item-price { color: var(--accent); font-weight: 600; font-size: 0.9rem; }
        .cart-item-qty { color: var(--muted); font-size: 0.8rem; margin-top: 0.25rem; }
        .cart-item-remove {
            background: none; border: none;
            color: var(--muted); cursor: pointer;
            font-size: 1.2rem; transition: color 0.3s;
            align-self: flex-start;
        }
        .cart-item-remove:hover { color: #ef4444; }

        .cart-footer {
            padding: 2rem;
            border-top: 1px solid var(--border);
        }
        .cart-total {
            display: flex;
            justify-content: space-between;
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
        }
        .checkout-btn {
            width: 100%;
            padding: 1.1rem;
            background: var(--accent);
            border: none;
            color: var(--bg);
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            border-radius: 12px;
            transition: all 0.4s;
        }
        .checkout-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(129,140,248,0.4);
        }

        .toast {
            position: fixed; bottom: 2rem; left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--card);
            border: 1px solid rgba(129,140,248,0.3);
            padding: 1rem 2rem; border-radius: 16px;
            color: var(--text); font-weight: 500;
            z-index: 400; opacity: 0;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            display: flex; align-items: center; gap: 0.75rem;
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
        .toast-icon {
            width: 24px; height: 24px;
            background: var(--accent); border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.8rem;
        }

        footer {
            padding: 4rem 3rem;
            text-align: center;
            border-top: 1px solid var(--border);
            color: var(--muted);
            font-size: 0.85rem;
        }
        footer .logo {
            margin-bottom: 1rem;
            display: inline-block;
            text-decoration: none;
        }

        @media (max-width: 768px) {
            .nav-links { display: none; }
            .page-header { padding: 8rem 1.5rem 3rem; }
            .shop-section { padding: 0 1.5rem 4rem; }
            .products-grid { grid-template-columns: 1fr; }
            .cart-sidebar { width: 100%; right: -100%; }
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent); }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="logo">ANON-X</a>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="shop.html" class="active">Shop</a>
            <a href="about.html">About</a>
        </div>
        <div class="cart-btn" onclick="toggleCart()">
            <span>🛒</span>
            <span class="cart-count" id="cartCount">0</span>
        </div>
    </nav>

    <div class="page-header">
        <h1>The Collection</h1>
        <p>Every piece selected for innovation, design, and uncompromising performance. Filter by category or explore the full range.</p>
    </div>

    <div class="shop-section">
        <div class="shop-filters">
            <button class="filter-btn active" onclick="filterProducts('all', this)">All Products</button>
            <button class="filter-btn" onclick="filterProducts('audio', this)">Audio</button>
            <button class="filter-btn" onclick="filterProducts('wearable', this)">Wearables</button>
            <button class="filter-btn" onclick="filterProducts('gaming', this)">Gaming</button>
            <button class="filter-btn" onclick="filterProducts('smart', this)">Smart Home</button>
        </div>

        <div class="products-grid" id="productsGrid"></div>
    </div>

    <div class="cart-overlay" id="cartOverlay" onclick="toggleCart()"></div>
    <div class="cart-sidebar" id="cartSidebar">
        <div class="cart-header">
            <h3>Your Cart</h3>
            <button class="cart-close" onclick="toggleCart()">×</button>
        </div>
        <div class="cart-items" id="cartItems">
            <div class="cart-empty">Your cart is empty</div>
        </div>
        <div class="cart-footer">
            <div class="cart-total">
                <span>Total</span>
                <span id="cartTotal">$0.00</span>
            </div>
            <button class="checkout-btn" onclick="checkout()">Proceed to Checkout</button>
        </div>
    </div>

    <div class="toast" id="toast">
        <div class="toast-icon">✓</div>
        <span id="toastMsg">Added to cart</span>
    </div>

    <footer>
        <a href="index.html" class="logo">ANON-X</a>
        <p>Premium Electronics · Est. 2024</p>
    </footer>

    <script>
        const products = [
            { id: 1, name: "Anon-X Pods Pro", cat: "audio", emoji: "🎧", price: 249.00, desc: "Active noise cancellation with 30-hour battery and spatial audio.", glow: "rgba(129,140,248,0.3)" },
            { id: 2, name: "Sonic Flow X", cat: "audio", emoji: "🎵", price: 189.99, desc: "Premium over-ear with adaptive EQ and memory foam cushions.", glow: "rgba(192,132,252,0.3)" },
            { id: 3, name: "BassCore 360", cat: "audio", emoji: "🔊", price: 129.50, desc: "Portable wireless speaker with 360° sound and IPX7 waterproof.", glow: "rgba(251,191,36,0.3)" },
            { id: 4, name: "Chrono Elite", cat: "wearable", emoji: "⌚", price: 399.00, desc: "ECG, blood oxygen, always-on display. Titanium case.", glow: "rgba(129,140,248,0.3)" },
            { id: 5, name: "FitTrack Pro", cat: "wearable", emoji: "💪", price: 149.99, desc: "SpO2, sleep stages, stress monitoring. 14-day battery.", glow: "rgba(16,185,129,0.3)" },
            { id: 6, name: "Vision VR One", cat: "gaming", emoji: "🥽", price: 599.00, desc: "Standalone VR, 4K per eye, hand tracking, 120Hz.", glow: "rgba(192,132,252,0.3)" },
            { id: 7, name: "Phantom Elite", cat: "gaming", emoji: "🎮", price: 79.99, desc: "Haptic feedback, customizable back buttons, 40hr battery.", glow: "rgba(239,68,68,0.3)" },
            { id: 8, name: "StreamDeck Pro", cat: "gaming", emoji: "🎬", price: 119.00, desc: "32-key programmable control surface with LCD keys.", glow: "rgba(251,191,36,0.3)" },
            { id: 9, name: "Echo Sphere", cat: "smart", emoji: "🔮", price: 89.99, desc: "360° smart speaker with voice assistant and room correction.", glow: "rgba(129,140,248,0.3)" },
            { id: 10, name: "Lumina Hub", cat: "smart", emoji: "💡", price: 59.00, desc: "Smart home brain. Controls 100+ devices. Matter-ready.", glow: "rgba(16,185,129,0.3)" },
            { id: 11, name: "GuardCam 4K", cat: "smart", emoji: "📹", price: 199.00, desc: "Wireless security with night vision, AI person detection.", glow: "rgba(239,68,68,0.3)" },
            { id: 12, name: "AirPure Pro", cat: "smart", emoji: "🌬️", price: 279.99, desc: "HEPA-13 filter, air quality display, whisper-quiet.", glow: "rgba(129,140,248,0.3)" },
            { id: 13, name: "Anon-X Studio Pro", cat: "audio", emoji: "🎧", price: 349.00, desc: "Flagship over-ear with adaptive ANC and 40hr battery.", glow: "rgba(129,140,248,0.4)" },
            { id: 14, name: "Pulse Buds", cat: "audio", emoji: "🎶", price: 99.00, desc: "Compact true wireless with deep bass and touch controls.", glow: "rgba(192,132,252,0.3)" },
            { id: 15, name: "Nova Watch", cat: "wearable", emoji: "⌚", price: 299.00, desc: "AMOLED display, GPS, NFC payments. 7-day battery.", glow: "rgba(251,191,36,0.3)" },
            { id: 16, name: "Arcade Stick", cat: "gaming", emoji: "🕹️", price: 149.00, desc: "Professional fight stick with Sanwa buttons and RGB.", glow: "rgba(239,68,68,0.3)" }
        ];

        let cart = JSON.parse(localStorage.getItem('anonx_cart')) || [];

        document.addEventListener('DOMContentLoaded', () => {
            renderProducts('all');
            updateCart();
        });

        function renderProducts(filter) {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';
            
            const filtered = filter === 'all' ? products : products.filter(p => p.cat === filter);
            
            filtered.forEach((p, i) => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.style.animation = `fadeUp 0.6s ease ${i * 0.05}s forwards`;
                card.style.opacity = '0';
                card.innerHTML = `
                    <div class="product-visual">
                        <div class="product-glow" style="background: ${p.glow}"></div>
                        <div class="product-emoji">${p.emoji}</div>
                    </div>
                    <div class="product-info">
                        <div class="product-cat">${p.cat}</div>
                        <div class="product-name">${p.name}</div>
                        <div class="product-desc">${p.desc}</div>
                        <div class="product-bottom">
                            <div class="product-price">$${p.price.toFixed(2)}</div>
                            <button class="add-btn" onclick="addToCart('${p.name}', ${p.price}, '${p.emoji}')"></button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterProducts(cat, btn) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderProducts(cat);
        }

        function addToCart(name, price, emoji) {
            const existing = cart.find(item => item.name === name);
            if (existing) {
                existing.qty++;
            } else {
                cart.push({ name, price, emoji, qty: 1 });
            }
            saveCart();
            updateCart();
            showToast(`${name} added to cart`);
        }

        function removeFromCart(name) {
            cart = cart.filter(item => item.name !== name);
            saveCart();
            updateCart();
        }

        function saveCart() {
            localStorage.setItem('anonx_cart', JSON.stringify(cart));
        }

        function updateCart() {
            const count = cart.reduce((sum, item) => sum + item.qty, 0);
            document.getElementById('cartCount').textContent = count;
            
            const itemsContainer = document.getElementById('cartItems');
            
            if (cart.length === 0) {
                itemsContainer.innerHTML = '<div class="cart-empty">Your cart is empty</div>';
                document.getElementById('cartTotal').textContent = '$0.00';
                return;
            }
            
            itemsContainer.innerHTML = cart.map(item => `
                <div class="cart-item">
                    <div class="cart-item-emoji">${item.emoji}</div>
                    <div class="cart-item-info">
                        <div class="cart-item-name">${item.name}</div>
                        <div class="cart-item-price">$${item.price.toFixed(2)}</div>
                        <div class="cart-item-qty">Qty: ${item.qty}</div>
                    </div>
                    <button class="cart-item-remove" onclick="removeFromCart('${item.name}')">×</button>
                </div>
            `).join('');
            
            const total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            document.getElementById('cartTotal').textContent = '$' + total.toFixed(2);
        }

        function toggleCart() {
            document.getElementById('cartSidebar').classList.toggle('open');
            document.getElementById('cartOverlay').classList.toggle('open');
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        function checkout() {
            if (cart.length === 0) {
                showToast('Your cart is empty');
                return;
            }
            showToast('Checkout coming soon!');
        }
    </script>
</body>
</html>
